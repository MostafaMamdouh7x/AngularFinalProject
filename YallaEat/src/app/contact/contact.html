<div class="container">
  <h2>Contact Us</h2>
  <div class="contact-wrapper">
    <!-- Left: Form -->
    <div class="contact-box">
      <h4>Send Message</h4>
      <input type="text" placeholder="Name" [(ngModel)]="contact.name">
      <input type="email" placeholder="Email" [(ngModel)]="contact.email">
      <textarea placeholder="Message" [(ngModel)]="contact.message" rows="5"></textarea>
      <button (click)="sendMessage()">Send Message</button>
    </div>

    <!-- Right: Info + Map -->
    <div class="info-wrapper">
      <div class="info-box">
        <h4>Quick Info</h4>
        <p>📞 +20 123 456 789</p>
        <p>✉️ info@YallaEat.com</p>
        <p>🕒 Open: 11am - 11pm</p>
      </div>

      <h4>Find Us</h4>
      <div class="map-box">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3423.2!2d31.2!3d30.0!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzDCsDAwJzAwLjAiTiAzMcKwMTInMDAuMCJF!5e0!3m2!1sen!2seg!4v123"
          width="100%" height="250" style="border:0;" allowfullscreen="" loading="lazy">
        </iframe>
        <button class="directions-btn">Get Directions</button>
      </div>
    </div>
  </div>
</div>
