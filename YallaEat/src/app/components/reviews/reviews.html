<section class="reviews" id="reviews">

  <div class="container">

    <div class="section-heading">
      <span>REVIEWS</span>
      <h2>What Our Customers <strong>Say</strong></h2>
      <p>Thousands of happy customers can't be wrong.</p>
    </div>

    <div class="slider">

      <button class="slider-btn prev" (click)="prevReview()">
        &#10094;
      </button>

      <div class="review-card">

        <div class="stars">★★★★★</div>

        <p class="review-text">
          "{{ reviews[currentReview].text }}"
        </p>

        <div class="customer">

          <div class="avatar">
            {{ reviews[currentReview].avatar }}
          </div>

          <div>
            <h4>{{ reviews[currentReview].name }}</h4>
            <span>{{ reviews[currentReview].location }}</span>
          </div>

        </div>

      </div>

      <button class="slider-btn next" (click)="nextReview()">
        &#10095;
      </button>

    </div>

    <div class="dots">

      <button
        *ngFor="let review of reviews; let i = index"
        [class.active]="i === currentReview"
        (click)="goToReview(i)">
      </button>

    </div>

  </div>

</section>
